<!doctype html>
<html lang="en">
<head>
<script>
// The saved picture size is applied before anything is drawn, so the page opens at that size instead of changing after it loads.
try { const f = Number(localStorage.getItem("pw-card-f")); if (f >= 50 && f <= 200) { document.documentElement.style.setProperty("--f", f / 100); document.documentElement.classList.add("sized"); } } catch (e) {}
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preset Wardrobe</title>
<style>
:root {
  --bg: #0f1114;
  --panel: #171a1f;
  --panel-2: #1e2229;
  --line: #2a2f38;
  --text: #eef0f3;
  --muted: #8f96a3;
  --faint: #5f6673;
  --accent: #5ecdfa;
  --accent-ink: #062330;
  --ok: #7bd88f;
  --warn: #f2b84b;
  --bad: #ff6b6b;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button {
  font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap;
}
button:hover:not(:disabled) { border-color: #3b4250; background: #242932; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { background: #7dd8fb; border-color: #7dd8fb; }
button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
#updBtn { border-color: var(--accent); color: var(--accent); font-weight: 600; }
#updBtn:disabled { opacity: .8; }
#updBtn.failed { border-color: var(--warn); color: var(--warn); }
.dialog p a { color: var(--accent); }
.dialog .notes { max-height: 220px; overflow: auto; white-space: pre-wrap; font-size: 12px; color: var(--muted); background: rgba(255,255,255,.03); border-radius: 8px; padding: 8px 10px; margin: 8px 0 0; }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover:not(:disabled) { color: var(--text); background: var(--panel-2); }
button.small { padding: 4px 9px; font-size: 12.5px; border-radius: 6px; }
input[type=search], .dialog input {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 12px;
}
input:focus { outline: none; border-color: var(--accent); }

header {
  display: flex; align-items: center; gap: 16px; padding: 12px 20px;
  border-bottom: 1px solid var(--line); background: #121418;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 15px; letter-spacing: .18em; font-weight: 800; }
.brand span { color: var(--faint); font-size: 12px; letter-spacing: .08em; }
.status {
  margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.status + .status { margin-left: 8px; }
.status.closed .dot { background: var(--warn); }
.dialog.settings .hint.warnline { color: var(--warn); }
.status.running .dot { background: var(--ok); }

.layout { --side-max: 270px; --side: var(--side-max); position: relative; display: grid; grid-template-columns: min(var(--side), var(--side-max)) 1fr; min-height: 0; }
.layout.collapsed { --side: 0px; }
.layout.collapsed aside { visibility: hidden; padding: 0; border-right: 0; }
aside { min-width: 0; overflow-x: hidden; }
aside > * { min-width: 170px; }
/* drag the edge of the sidebar to resize it; all the way left hides it */
#sideGrip { position: absolute; top: 0; bottom: 0; left: calc(min(var(--side), var(--side-max)) - 4px); width: 9px; cursor: col-resize; z-index: 5; touch-action: none; }
#sideGrip::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; background: var(--accent); opacity: 0; transition: opacity .15s; }
#sideGrip:hover::after, #sideGrip.drag::after { opacity: .6; }
.layout.collapsed #sideGrip { left: 0; width: 6px; }
#sideOpen { display: none; position: absolute; top: 10px; left: 10px; z-index: 6; padding: 6px 10px; }
.layout.collapsed #sideOpen { display: block; }
.layout.collapsed main { padding-left: 64px; }
body.sidedrag { cursor: col-resize; user-select: none; }
aside { border-right: 1px solid var(--line); padding: 16px 12px 10px; overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
#sideNav { flex: 0 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
/* the activity log fills what the list leaves free at the bottom of the sidebar */
#sideLog { flex: 0 0 auto; margin-top: auto; display: flex; flex-direction: column; border-top: 1px solid var(--line); padding-top: 4px; }
.loghead { display: flex; align-items: center; justify-content: space-between; }
.loghead .label { padding: 8px 10px 6px; }
.loghead button { padding: 2px 8px; font-size: 11px; }
#logList { flex: none; height: 185px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding: 2px 6px 4px 4px; font: 11px/1.4 ui-monospace, Consolas, "Cascadia Mono", monospace; }
#logList .ln { display: block; white-space: pre-line; overflow-wrap: anywhere; }
#logList .ts { color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; margin-right: 7px; }
#logList .tx { color: #c9ced6; }
#logList .ln.lv-ok .ts { color: var(--ok); }
#logList .ln.lv-warn .ts, #logList .ln.lv-warn .tx { color: var(--warn); }
#logList .ln.lv-bad .ts, #logList .ln.lv-bad .tx { color: var(--bad); }
#logList .day { text-align: center; color: var(--faint); font-size: 10.5px; padding: 6px 0 2px; }
#logList .none { color: var(--faint); font-family: inherit; padding: 6px 4px; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--faint); padding: 14px 10px 6px; }
.label:first-child { padding-top: 0; }
.helplink { margin-left: 4px; color: var(--accent); text-decoration: none; letter-spacing: 0; font-weight: 600; cursor: pointer; }
.helplink:hover { text-decoration: underline; }
.dialog.help { width: min(480px, calc(100vw - 32px)); }
.dialog.help p, .dialog.help li { font-size: 13.5px; line-height: 1.5; }
.dialog.help ul { margin: 6px 0 10px; padding-left: 20px; display: grid; gap: 5px; }
.nav {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; width: 100%;
  text-align: left; padding: 10px 12px; border-radius: 8px; background: transparent; border: 1px solid transparent;
}
.nav:hover:not(:disabled) { background: var(--panel); border-color: transparent; }
.nav.on { background: var(--panel-2); border-color: var(--line); }
.nav .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.nav .meta { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.badge {
  font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 2px 7px; border-radius: 999px;
  background: rgba(123,216,143,.14); color: var(--ok); text-transform: uppercase; white-space: nowrap;
}
.badge.blue { background: rgba(94,205,250,.16); color: var(--accent); }
.badge.grey { background: rgba(143,150,163,.14); color: var(--muted); }
.badge.new { background: var(--warn); color: #241a05; }
.side-actions { display: flex; flex-direction: column; gap: 8px; padding: 12px 2px 0; }
.side-actions button { width: 100%; }
details.autos summary { list-style: none; cursor: pointer; }
details.autos summary::-webkit-details-marker { display: none; }
details.autos summary::after { content: " ▸"; }
details.autos[open] summary::after { content: " ▾"; }

main { overflow-y: auto; padding: 24px 28px 96px; min-width: 0; }
.head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.head h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.head .sub { color: var(--muted); margin-top: 4px; }
.head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; flex: none; }
.head > div:first-child { flex: 1 1 320px; min-width: 0; } /* the title and its line take what's left, so the buttons stay beside them */

.notice {
  display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--radius);
  background: var(--panel); border: 1px solid var(--line); margin-bottom: 18px; color: var(--muted);
}
.notice strong { color: var(--text); }
.notice .grow { flex: 1; }
.notice.warn { border-color: rgba(242,184,75,.35); }
.notice.bad { border-color: rgba(255,107,107,.45); color: #ffb3b3; }
.kbd { font: 600 12px ui-monospace, Consolas, monospace; padding: 1px 6px; border: 1px solid #3b4250; border-bottom-width: 2px; border-radius: 5px; color: var(--text); }

.pending {
  display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: center; padding: 14px 16px;
  border-radius: var(--radius); background: var(--panel); border: 1px solid rgba(94,205,250,.45); margin-bottom: 18px;
}
.pending img { width: 120px; aspect-ratio: 3/4; object-fit: contain; border-radius: 8px; background: #1b1f26; }
.pending h3 { margin: 0 0 4px; font-size: 16px; }
.pending p { margin: 0 0 12px; color: var(--muted); }
.slotpick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1250px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .layout { --side-max: 220px; } }
/* The slider scales the automatic card width, so 100% always means "as it is now" whatever the window size. */
#main { container-type: inline-size; }
.grid { --n: 5; }
@media (max-width: 1250px) { .grid { --n: 4; } }
@media (max-width: 1000px) { .grid { --n: 3; } }
html.sized #main .grid { grid-template-columns: repeat(auto-fill, minmax(calc((100cqw - 14px * (var(--n) - 1)) / var(--n) * var(--f) - 1px), 1fr)); }
#sizeCtl { position: absolute; right: 24px; bottom: 14px; z-index: 4; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(20,23,28,.92); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,.35); color: var(--muted); font-size: 12px; backdrop-filter: blur(6px); }
#sizeCtl:hover { color: var(--text); }
#sizeCtl svg { width: 14px; height: 14px; flex: none; }
.sizeTrack { position: relative; display: inline-flex; align-items: center; }
#sizeDef { position: absolute; top: 50%; left: calc(8px + (100 - 50) / (200 - 50) * (100% - 16px)); width: 2px; height: 14px; margin: -7px 0 0 -1px; border-radius: 1px; background: var(--warn); pointer-events: none; }
#sizeCtl input[type=range] { width: 120px; accent-color: var(--accent); margin: 0; }
.layout.collapsed #sizeCtl { right: 24px; }
/* A card's bottom-right corner can be dragged: wider (2 or 3 columns) and taller (shows more of the fit's pieces). */
.wgrip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; z-index: 6; touch-action: none; }
.wgrip::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 8px; height: 8px; border-right: 2px solid var(--faint); border-bottom: 2px solid var(--faint); border-radius: 0 0 3px 0; opacity: 0; transition: opacity .12s; }
.card:hover .wgrip::after, body.wdrag .card.wdragging .wgrip::after { opacity: .8; }
body.wdrag, body.wdrag * { cursor: nwse-resize !important; user-select: none !important; }
.card.wide .pic { aspect-ratio: auto; height: calc((100cqw - 14px * (var(--span) - 1)) / var(--span) * 4 / 3); }
#wReset { width: 24px; height: 24px; padding: 0; display: grid; place-items: center; flex: none; border-radius: 50%; background: transparent; border: 1px solid var(--line); color: var(--muted); cursor: pointer; }
#wReset[hidden] { display: none; }
#wReset:hover { color: var(--text); background: var(--panel-2); }
#wReset svg { width: 13px; height: 13px; }
.card {
  position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; display: flex; flex-direction: column; container-type: inline-size;
}
@container (max-width: 150px) { .card .pic .hint { display: none; } }
.card.sel { border-color: rgba(94,205,250,.6); }
.card.pickable { cursor: pointer; }
.card.pickable:hover { border-color: #3b4250; }
.card.picked { border-color: var(--accent); }
/* the ring is drawn over the card (picture included), so it's even all round and shows at once */
.card.picked::after {
  content: ""; position: absolute; inset: 0; border: 2px solid var(--accent); border-radius: inherit;
  pointer-events: none; z-index: 5;
}
.pic {
  position: relative; aspect-ratio: 3 / 4;
  background: radial-gradient(120% 80% at 50% 100%, #262b34 0%, #181b21 60%, #15181d 100%);
  display: grid; place-items: center;
}
.pic img { width: 100%; height: 100%; object-fit: contain; object-position: 50% 80%; pointer-events: none; user-select: none; }
.pic[data-frames] { cursor: grab; touch-action: pan-y; }
.pic[data-frames].turning { cursor: grabbing; }
.pic .hint {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 11px; color: var(--muted);
  background: rgba(15,17,20,.78); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
  white-space: nowrap; transition: opacity .15s; pointer-events: none;
}
.pic[data-frames]:hover .hint, .pic[data-frames].turning .hint { opacity: 0; }
.picbtns button { position: absolute; bottom: 6px; }
.picbtns .picboard { left: 6px; }
.picbtns .picbig { right: 6px; }
.picbtns button {
  width: 24px; height: 24px; padding: 0; display: grid; place-items: center; border-radius: 6px; cursor: pointer; z-index: 1;
  background: rgba(15,17,20,.72); border: 1px solid var(--line); color: var(--text); font-size: 12px; line-height: 1;
}
.picbtns button:hover { background: var(--panel-2); }
.picbtns button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.picbtns svg { width: 12px; height: 14px; pointer-events: none; }
.picbtns .picreset { left: 50%; transform: translateX(-50%); font-size: 14px; }
.pic { overflow: hidden; }
.pic img { position: absolute; inset: 0; transform-origin: 50% 58%; will-change: transform, opacity; }
/* a turnable picture sits above the corner icons and the hint along the bottom */
.pic[data-frames] img { top: 2%; bottom: 13%; left: 0; width: 100%; height: 85%; object-position: 50% 100%; }
/* Zoom: a thin slider down the left edge, there when the picture is hovered (and a little when zoomed in) */
.pic img, .viewer .stage img { transform: translate(calc(var(--px, 0) * (var(--z, 1) - 1) * 50%), calc(var(--pf, 0) * (var(--z, 1) - 1) * 50%)) scale(var(--z, 1)); }
.zoombar {
  position: absolute; left: 7px; top: 39%; height: 40%; width: 16px; z-index: 6; display: grid; place-items: center;
  opacity: .22; transition: opacity .15s;
}
.pic:hover .zoombar, .viewer .stage:hover .zoombar, .zoombar:focus-within { opacity: .85; }
.pic.zoomed .zoombar, .viewer .stage.zoomed .zoombar { opacity: .4; }
.pic.zoomed:hover .zoombar, .viewer .stage.zoomed:hover .zoombar { opacity: .95; }
.pic.turning .zoombar { opacity: 0 !important; }
.zoomer, .dialog input.zoomer, .viewer .controls input[type=range] {
  -webkit-appearance: none; appearance: none; background: transparent; margin: 0; padding: 0; border: 0; border-radius: 0; cursor: pointer;
  writing-mode: vertical-lr; direction: rtl; width: 16px; height: 100%;
}
.zoomer::-webkit-slider-runnable-track {
  width: 2px; border-radius: 2px;
  background: linear-gradient(to top, var(--accent) var(--fill, 0%), rgba(255,255,255,.28) var(--fill, 0%));
}
.zoomer::-webkit-slider-thumb, .viewer .controls input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 10px; height: 10px; border-radius: 50%; margin-left: -4px;
  background: var(--text, #e8eaed); border: 1px solid rgba(0,0,0,.5);
}
.zoomer:hover::-webkit-slider-thumb, .zoomer:active::-webkit-slider-thumb,
.viewer .controls input[type=range]:hover::-webkit-slider-thumb, .viewer .controls input[type=range]:active::-webkit-slider-thumb { background: var(--accent); }
.zoomer:focus, .viewer .controls input[type=range]:focus { outline: none; }
/* the turn slider in the viewer, in the same style (flat, thin, a small round handle) */
.viewer .controls input[type=range] { height: 16px; width: auto; flex: 1; writing-mode: horizontal-tb; direction: ltr; }
.viewer .controls input[type=range]::-webkit-slider-runnable-track {
  height: 2px; border-radius: 2px;
  background: linear-gradient(to right, var(--accent) var(--vfill, 0%), rgba(255,255,255,.28) var(--vfill, 0%));
}
.viewer .controls input[type=range]::-webkit-slider-thumb { margin-left: 0; margin-top: -4.5px; }
/* "Lock preview?": a small box in the top right corner of a picture; ticked, the picture keeps its look */
.savepv { position: absolute; top: 7px; right: 7px; z-index: 7; display: flex; flex-direction: row-reverse; align-items: center; gap: 6px; cursor: pointer; opacity: .3; transition: opacity .15s; }
.pic:hover .savepv, .viewer .stage:hover .savepv, .savepv:focus-within { opacity: .92; }
.savepv.on { opacity: .5; }
.pic:hover .savepv.on, .viewer .stage:hover .savepv.on { opacity: .95; }
.pic.turning .savepv { opacity: 0 !important; }
.savepv input, .dialog .savepv input { position: absolute; opacity: 0; width: 0; height: 0; padding: 0; margin: 0; border: 0; }
.savepv { pointer-events: none; } /* its hint's space never blocks the labels under it */
.savepv .box { pointer-events: auto; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid rgba(255,255,255,.55); background: rgba(15,17,20,.6); display: grid; place-items: center; box-sizing: border-box; }
.savepv:hover .box { border-color: var(--accent); }
.savepv input:checked + .box { background: var(--accent); border-color: var(--accent); }
.savepv input:checked + .box::after { content: ""; width: 4px; height: 8px; border: solid var(--accent-ink); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.savepv input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.savepv .tip { font-size: 11px; color: var(--muted); background: rgba(15,17,20,.82); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none; }
.savepv:hover .tip { opacity: 1; }
/* the hint covers the badges: they step aside while it's showing */
.pic .badges { transition: opacity .12s; }
.pic:has(.savepv:hover) .badges { opacity: 0; }
/* the badges make room for it */
.pic[data-frames] .badges { right: 32px; }
.viewer .stage { position: relative; }
.viewer .zoombar { left: 12px; width: 20px; }
.pic.zoomed[data-frames] { cursor: grab; }
.pic .lockhint {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 11px; color: var(--muted); z-index: 1;
  background: rgba(15,17,20,.78); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px;
  white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s;
}
/* only once it's actually been turned (not just pressed): then "click to lock" makes sense */
.pic[data-frames].spun:hover .lockhint { opacity: 1; }
.pic[data-frames][data-held]:hover .lockhint { opacity: 0; }
.viewer .stage { cursor: grab; touch-action: pan-y; }
.viewer .stage.turning { cursor: grabbing; }
.viewer { width: min(760px, calc(100vw - 48px)); grid-template-columns: minmax(0, 1fr); } /* the row's contents never widen the dialog */
.viewer .stage {
  /* a fixed frame: its size comes from the window alone, never from the picture in it (a larger enhanced picture
     swapping in must not make the frame jump) */
  aspect-ratio: 3 / 4; width: min(100%, calc((100vh - 230px) * 0.75)); margin: 0 auto; border-radius: 10px; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 100%, #262b34 0%, #181b21 60%, #15181d 100%);
}
.viewer .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.viewer .controls { display: flex; gap: 10px; align-items: center; min-width: 0; }
.viewer .controls button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.viewer .vrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.viewer .vrow .modes { margin: 0; }
.viewer .enhbar { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.viewer #vEnh { white-space: nowrap; min-width: 118px; } /* wide enough for "Enhance 24/24" */
.viewer #vEnh.on { border-color: var(--accent); color: var(--text); }
.viewer .enhprog { display: flex; align-items: center; gap: 10px; margin: -4px 0 10px; font-size: 11.5px; color: var(--muted); }
.viewer .enhprog[hidden] { display: flex; visibility: hidden; } /* keeps its space, so the picture doesn't jump */
.viewer .enhprog .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.viewer .enhprog .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.viewer #vEnh:disabled { color: var(--muted); opacity: .45; cursor: not-allowed; } /* grey until a size is picked */
.viewer .enhsize { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.viewer .enhsize button { border: 0; border-radius: 0; padding: 5px 10px; background: transparent; color: var(--muted); font-size: 12px; }
.viewer .enhsize button + button { border-left: 1px solid var(--line); }
.viewer .enhsize button.on { background: var(--panel-2); color: var(--text); }
.viewer .enhsize button.made { color: #5fd38d; } /* made already this session */
.viewer .controls input { flex: 1; accent-color: var(--accent); }
.viewer .angle { color: var(--muted); font-variant-numeric: tabular-nums; width: 76px; text-align: right; }

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
// The snap key as ReSkate has it (Settings > Controls in the game; the app reads it): F8 unless changed. "" means
// the player cleared it. On a controller, holding Y in the Skaters menu snaps too.
const snapKeyText = () => { const k = S && S.hotkeys ? S.hotkeys.key : "F8"; return k === "" ? "your snap key" : (k || "F8"); };
const snapKey = () => { const k = S && S.hotkeys ? S.hotkeys.key : "F8"; return k === "" ? "your snap key" : `<span class="kbd">${esc(k || "F8")}</span>`; };
const snapPad = () => esc((S && S.hotkeys && S.hotkeys.pad) || "");
// " (or hold Y in the Skaters menu)", when there's a controller button.
const snapPadNote = () => snapPad() ? ` (or hold <span class="kbd">${snapPad()}</span> on a controller)` : "";
let S = null, lastJSON = "", view = "lineup", busy = false, search = "", picked = [];
let loadNote = null; // {id, text}: the note under "Load into game", shown only after a load went through
// The Fit Catalogue's Show filter: "both" (skater and board), "skater" or "board". Each card's
// picture and pieces follow it.
let catShow = "both";
// Fit Catalogue: only the favorites
let catFilter = "";
try { catFilter = localStorage.getItem("catFilter") || ""; } catch (e) {}
// The filters on offer: key, label, and which fits they keep (the same tags the cards carry)
const FILTERS = [
  ["favorite", "Favorites", f => f.favorite],
  ["ingame", "In game", f => f.in_game],
  ["new", "New", f => f.new],
  ["mixed", "Mixed", f => f.mixed],
  ["requested", "Picture asked", f => f.requested],
  ["rotation", "In a rotation", f => f.rotations.length > 0],
  ["picked", "Picked for rotation", f => picked.includes(f.hash)]];
const filterIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8.5V20l-4-2v-4.5z"/></svg>`;
try { catShow = localStorage.getItem("catShow") || "both"; } catch (e) {}
const BOARD_CATS = ["Deck", "Grip", "Grip cutout", "Trucks", "Wheels"];
function piecesFor(item, show) {
  if (show === "skater") return item.pieces.filter(p => !p.board);
  if (show === "board") return item.pieces.filter(p => p.board);
  return item.pieces;

// The sidebar: drag its edge to make it narrower (never wider than it starts); all the way left hides it.
(function () {
  const layout = $("#layout"), grip = $("#sideGrip"), MIN = 180, HIDE = 110;
  let w = null, collapsed = false;
  try { const t = JSON.parse(localStorage.getItem("pw-side") || "null"); if (t) { w = t.w; collapsed = !!t.c; } } catch (e) {}
  const max = () => parseFloat(getComputedStyle(layout).getPropertyValue("--side-max")) || 270;
  const apply = () => {
    layout.classList.toggle("collapsed", collapsed);
    if (collapsed) layout.style.setProperty("--side", "0px");
    else if (w) layout.style.setProperty("--side", w + "px"); else layout.style.removeProperty("--side");
    try { localStorage.setItem("pw-side", JSON.stringify({w, c: collapsed})); } catch (e) {}
  };
  apply();
  grip.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    grip.classList.add("drag"); document.body.classList.add("sidedrag");
    const left = layout.getBoundingClientRect().left;
    let cur = collapsed ? 0 : Math.min(w || max(), max());
    const move = ev => {
      cur = Math.max(0, Math.min(max(), ev.clientX - left));
      // under the hide point it already looks hidden (no strip of sidebar left over)
      layout.classList.toggle("collapsed", cur < HIDE);
      layout.style.setProperty("--side", (cur < HIDE ? 0 : cur) + "px");
    };
    const up = () => {
      grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); grip.removeEventListener("pointercancel", up);
      grip.classList.remove("drag"); document.body.classList.remove("sidedrag");
      if (cur < HIDE) { collapsed = true; } else { collapsed = false; w = Math.max(MIN, Math.min(max(), cur)); if (w >= max() - 1) w = null; }
      apply();
    };
    grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up); grip.addEventListener("pointercancel", up);
  });
  $("#sideOpen").onclick = () => { collapsed = false; apply(); };
})();

// ---- the fit picker for a rotation slot ----
// A change made inside the running game: a progress box while the app works, the face-and-body choice remembered.
async function liveCall(url, payload, onDone) {
  const box = document.createElement("div");
  box.className = "progress";
  box.innerHTML = `<b>Loading into the running game…</b><div class="sub2"><span class="secs">0</span> s</div><div class="bar"></div>`;
  document.body.append(box);
  addLog("info", "Loading into the running game. Stay on this screen until it finishes.");
  const t0 = Date.now(), timer = setInterval(() => { box.querySelector(".secs").textContent = Math.round((Date.now() - t0) / 1000); }, 500);
  try {
    const body = true; // the whole fit: clothes, board, face and body
    const res = await api(url, {...payload, live: true, body});
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    if (res && res.log) res.log.push({level: "info", text: `Finished in ${secs} s.`});
    if (onDone) onDone(res);
    setTimeout(afterLiveLoad, 50);
    return res;
  }
  finally { clearInterval(timer); box.remove(); }
}

// After a load into the running game: back to skate. (its window to the front, this one minimized), or stay.
// Asked each time unless a choice was remembered; Settings changes it.
function afterLiveLoad() {
  const pref = (S && S.after_load) || "ask";
  if (pref === "stay") return;
  const goBack = () => api("/api/focus-game", {}).catch(e => toast(e.message, true));
  if (pref === "game") { goBack(); return; }
  document.querySelectorAll(".backprompt").forEach(b => b.remove());
  const box = document.createElement("div");
  box.className = "backprompt";
  box.innerHTML = `<div class="bp-text">Loaded. Go back to skate.?</div>
    <div class="bp-buttons"><button class="primary" id="bpGo">Go back to the game</button><button id="bpStay">Stay here</button></div>
    <label class="opt"><input type="checkbox" id="bpRemember"> Remember my choice</label>
    <div class="bp-timer"></div>`;
  document.body.append(box);
  // It closes by itself after a while (as "stay here", nothing remembered): the bar shows the time left. The time
  // stops while the pointer is on the prompt or a choice in it has the focus, and starts again after.
  const LIFE = 8000;
  const bar = $(".bp-timer", box);
  let left = LIFE, last = performance.now(), held = false, closed = false;
  const hold = on => { held = on; };
  box.addEventListener("pointerenter", () => hold(true));
  box.addEventListener("pointerleave", () => hold(box.contains(document.activeElement)));
  box.addEventListener("focusin", () => hold(true));
  box.addEventListener("focusout", () => setTimeout(() => hold(box.matches(":hover") || box.contains(document.activeElement)), 0));
  const tick = now => {
    if (closed || !box.isConnected) return; // closed, or replaced by the prompt of a newer load
    if (!held) left -= now - last;
    last = now;
    bar.style.transform = `scaleX(${Math.max(0, left / LIFE)})`;
    if (left <= 0) { done("timeout"); return; }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  const done = async choice => {
    if (closed) return;
    closed = true;
    box.remove();
    if (choice === "timeout") return;
    if ($("#bpRemember", box).checked) {
      try { await api("/api/settings", {after_load: choice}); S.after_load = choice; toast(choice === "game" ? "OK: after a load, the app takes you back to skate. (change it in Settings)" : "OK: after a load, the app stays open (change it in Settings)"); } catch (e) {}
    }
    if (choice === "game") goBack();
  };
  $("#bpGo", box).onclick = () => done("game");
  $("#bpStay", box).onclick = () => done("stay");
}

function pickFit(slot, title) {
  return new Promise(resolve => {
    const fits = S.fits.filter(f => !f.hidden);
    const scrim = document.createElement("div");

    scrim.innerHTML = `<div class="dialog wide"><h2>${esc(title || `Pick a fit for slot ${slot + 1}`)}</h2>
      <input type="search" id="pickSearch" placeholder="Search fits">
      <div class="grid" id="pickGrid"></div>
      <div class="buttons"><button id="pickCancel">Cancel</button></div></div>`;
    document.body.append(scrim);
    const grid = $("#pickGrid", scrim);
    const draw = q => {
      const list = fits.filter(f => !q || f.name.toLowerCase().includes(q) || f.pieces.some(p => p.title.toLowerCase().includes(q)));
      grid.innerHTML = list.length ? list.map(f => `<div class="card pickable" data-choose="${f.hash}" title="${esc(f.pieces.map(x => x.category + ": " + x.title).join("\n"))}">${pic(f, "", f.in_game ? `<span class="badge">In game</span>` : "")}<div class="info"><div class="title">${esc(f.name)}</div></div></div>`).join("")
        : `<div class="blank">${fits.length ? "No fits match." : "Your Fit Catalogue is empty."}</div>`;
      grid.querySelectorAll("[data-choose]").forEach(el => el.onclick = () => done(el.dataset.choose));
    };
    const done = v => { scrim.remove(); resolve(v); render(); };
    $("#pickSearch", scrim).oninput = e => draw(e.target.value.toLowerCase());
    $("#pickCancel", scrim).onclick = () => done(null);
    scrim.onclick = e => { if (e.target === scrim) done(null); };

  on("lineupRotation", async () => {

  });
  all("data-rename", async h => {
    const f = fitsBy()[h];

  });
  all("data-delete", async h => {
    const f = fitsBy()[h];
    const used = f.rotations.length ? ` It's in ${f.rotations.length} rotation${f.rotations.length > 1 ? "s" : ""}; those slots become empty.` : "";
    const ok = await dialog({title: `Delete ${f.name}?`, text: "It's removed from your Fit Catalogue. Your game isn't changed." + used, okText: "Delete", danger: true});
    if (ok) act(async () => { picked = picked.filter(x => x !== h); return api("/api/fit/delete", {hash: h}); });
  });
  on("clearPicks", () => { picked = []; render(); });
  on("makeRotation", async () => {
    const name = await dialog({title: "Make a rotation", text: `Your ${picked.length} picks fill slots 1 to ${picked.length}, in the order you picked them.${picked.length < 10 ? " The other slots keep what's in the game." : ""}`, input: S.default_rotation_name, okText: "Make rotation"});
    if (name === null) return;
    act(async () => { const r = await api("/api/rotation/create", {name, slots: picked}); picked = []; view = r.id; return r; });
  });
  on("mixBtn", () => openMix());
  on("exportCat", () => { location.href = "/api/export"; toast("Exporting your Fit Catalogue as a .wardrobe file."); });

  // rotation
  const r = S.rotations.find(x => x.id === view);
  if (!r) return;
  const save = slots => act(() => api("/api/rotation/update", {id: r.id, slots}));
  all("data-slotpick", async i => {
    const h = await pickFit(+i);
    if (!h) return;
    const slots = [...r.slots]; slots[+i] = h; save(slots);
  });
  all("data-clear", i => { const slots = [...r.slots]; slots[+i] = ""; save(slots); });
  all("data-move", v => {
    const [i, d] = v.split(",").map(Number), j = i + d, slots = [...r.slots];
    [slots[i], slots[j]] = [slots[j], slots[i]]; save(slots);
  });
  // One button. The game running: the change is applied live and written to the game's file when it closes.
  // The game closed: the file is written straight away.
  on("load", async () => {
    if (!S.game_running) {
      const ok = await dialog({title: `Load ${r.name}?`, text: `${r.filled} of your game's slots get this rotation's fits.${r.filled < 10 ? " The empty slots keep what's in the game." : ""} Your current lineup is saved in Undo history first, so you can put it back.`, okText: "Load into game"});

        loadNote = {id: r.id, text: "Saved. It will be there next time you start the game."};
        return res;
      });
      return;
    }
    act(() => liveCall("/api/rotation/load", {id: r.id}, () => { loadNote = {id: r.id, text: "Applied now. It's saved when you close the game."}; }));
  });
  on("rename", async () => {
    const name = await dialog({title: "Rename rotation", input: r.name, okText: "Rename"});
    if (name) act(() => api("/api/rotation/update", {id: r.id, name}));
  });
  on("export", () => { location.href = "/api/export?rotation=" + encodeURIComponent(r.id); toast("Exporting " + r.name + " as a .wardrobe file."); });
  on("delete", async () => {
    const ok = await dialog({title: `Delete ${r.name}?`, text: "The rotation is removed. Its fits stay in your Fit Catalogue, and your game isn't changed.", okText: "Delete", danger: true});
    if (ok) act(async () => { const res = await api("/api/rotation/delete", {id: r.id}); view = "lineup"; return res; });
  });
}

// Turning a preview: press on the picture and drag sideways. Just pointing at it does nothing, and a
// click without a drag still picks the card. ⤢ opens the big viewer; the board button flips between

const preloaded = new Set();
let spinBusy = false; // dragging: the page isn't redrawn under the player's hand
function preload(frames) {
  const key = frames.map(showPic).join("|");
  if (preloaded.has(key)) return;
  preloaded.add(key);

function showFrame(box, n) {

// How far to drag for one frame: a whole turn over about a card and a half; a board view per third.
function dragStep(box, count, board) {

}
function startDrag(e, el, getFrames, getN, setN, board, onEnd, pan) {

  const x0 = e.clientX, y0 = e.clientY, n0 = getN();
  let moved = false, dx = 0, dy = 0, lastDy = 0;
  // The cursor is held on the picture while you turn it (and hidden), so the drag can't wander off
  // across the screen; where that isn't allowed, the drag is followed as it goes.
  let locked = false;
  try { const r = el.requestPointerLock && el.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (_) {}

      const my = ev.movementY || 0;
      if (Math.abs(my) < 150) dy += my; // the same jump guard as sideways
    } else { dx = ev.clientX - x0; dy = ev.clientY - y0; }
    const panning = pan && pan.can();
    if (!moved && Math.abs(dx) < 4 && !(panning && Math.abs(dy) >= 4)) return;
    if (!moved) { moved = true; el.classList.add("turning"); }
    if (panning) { pan.by(dy - lastDy); lastDy = dy; }
    // dragging right turns the skater to the right
    setN(n0 + Math.round(dx / dragStep(el, frames.length, board())));
  };

    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    document.removeEventListener("pointercancel", up);

    el.classList.remove("turning");
    spinBusy = false;
    if (moved) { // the click that follows a drag doesn't pick the card
      const eat = ev => { ev.stopPropagation(); ev.preventDefault(); };
      window.addEventListener("click", eat, {capture: true, once: true});

// Held: after a click on the picture, it stays where you turn it, and ↺ (where the hint was) puts it

function setHeld(box, n) {

document.addEventListener("pointerdown", e => {

// ---- favorites ----
// "Add to favorites" in a picture's right-click menu (the same one takes it back). The little star on the card is a button too.
// The animation lives in its own layer on the page, so a redraw of the cards underneath can't cut it short.
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
function favBurst(rect, on) {
  const layer = document.createElement("div");

  layer.style.left = rect.left + rect.width / 2 + "px";
  layer.style.top = rect.top + rect.height / 2 + "px";
  const size = Math.max(54, Math.min(130, Math.min(rect.width, rect.height) * 0.46));
  const add = (cls, sz, html) => {

    if (html) el.innerHTML = html;
    layer.append(el);
    return el;
  };
  const ctr = "translate(-50%, -50%)";
  document.body.append(layer);
  const done = ms => setTimeout(() => layer.remove(), ms);
  if (reduceMotion()) {
    const big = add("big", size, favIcon());
    big.animate([{transform: ctr, opacity: on ? 1 : .6}, {transform: ctr, opacity: 0}], {duration: 700, easing: "ease-out", fill: "forwards"});
    return done(760);
  }
  if (!on) { // taking it back: the mark shrinks away, no fanfare
    const big = add("big", size, favIcon());
    big.style.opacity = .85;
    big.animate([{transform: ctr + " scale(1)", opacity: .85}, {transform: ctr + " scale(.55) rotate(-10deg)", opacity: 0}],
      {duration: 380, easing: "cubic-bezier(.4,0,.8,.6)", fill: "forwards"});

    {duration: 650, delay: 60, easing: "cubic-bezier(.2,.7,.3,1)", fill: "both"});
  // the mark itself: pops in past its size, settles, holds a moment, then floats up and fades
  const big = add("big", size, favIcon());

  big.animate([
    {transform: `${ctr} scale(0) rotate(${rot}deg)`, opacity: 0, offset: 0},
    {transform: `${ctr} scale(1.32) rotate(${-rot / 3}deg)`, opacity: 1, offset: .26},
    {transform: `${ctr} scale(.92) rotate(0deg)`, opacity: 1, offset: .42},
    {transform: `${ctr} scale(1.04) rotate(0deg)`, opacity: 1, offset: .56},
    {transform: `${ctr} scale(1) rotate(0deg)`, opacity: 1, offset: .76},
    {transform: `translate(-50%, -105%) scale(.9) rotate(0deg)`, opacity: 0, offset: 1}],
    {duration: 1100, easing: "ease-out", fill: "both"});

    const dist = size * (.7 + Math.random() * .55);
    const sz = 9 + Math.random() * 11;

      {transform: `${ctr} translate(0,0) scale(.2) rotate(0deg)`, opacity: 0, offset: 0},

      {transform: `${ctr} translate(${Math.cos(ang) * dist}px, ${Math.sin(ang) * dist + 14}px) scale(.35) rotate(${spin}deg)`, opacity: 0, offset: 1}],

function toggleFav(hash, rect) {

function zoomTo(box, target) {

  const from = box.dataset.mode === "board" ? 1 : 0;
  if (from === target) return;
  spinBusy = true;
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / ZOOM_MS);
    box._p = from + (target - from) * t;

  scrim.tabIndex = -1;
  scrim.addEventListener("keydown", e => {
    if (e.key === "Escape") close();
    if (e.key === "ArrowRight") { stop(); show((Number(range.value) + 1) % frames.length); }
    if (e.key === "ArrowLeft") { stop(); show((Number(range.value) - 1 + frames.length) % frames.length); }
  });
  scrim.focus();
}


// ---- Mix & match: a new fit from one fit's skater and another fit's board ----
function openMix() {
  const all = S.fits.filter(f => !f.hidden);
  let sk = null, bd = null, nameText = "";
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  const skTile = f => `<button class="tile${sk === f.hash ? " sel" : ""}" data-sk="${f.hash}" title="${esc(f.name)}"><div class="im">${f.picture ? `<img src="${esc(thumb(f.picture))}" alt="" loading="lazy">` : silhouette}</div><b>${esc(f.name)}</b><span class="chk">✓</span></button>`;
  const bdTile = f => `<button class="tile${bd === f.hash ? " sel" : ""}" data-bd="${f.hash}" title="${esc(f.name)}"><div class="im">${hasBoard(f) ? `<img src="${esc(thumb(f.board[0]))}" alt="" loading="lazy">` : boardIcon}</div><b>${esc(f.name)}</b><span class="chk">✓</span></button>`;
  const fit = h => all.find(f => f.hash === h);
  const draw = () => {
    const keepScroll = [...scrim.querySelectorAll(".tiles")].map(t => t.scrollTop);
    const A = fit(sk), B = fit(bd);
    const pieces = !A || !B ? [] : [...A.pieces.filter(p => !p.board).map(p => ({...p, src: A.name})), ...B.pieces.filter(p => p.board).map(p => ({...p, src: B.name}))];
    scrim.querySelector(".dialog").innerHTML = `
      <div><h2>Mix &amp; match</h2><div class="muted" style="font-size:13px">Pick a skater from one fit and a board from another. It's saved as a new fit; the originals stay as they are.</div></div>
      <div class="cols">
        <div class="col"><div class="lab">1 · Skater from</div><div class="tiles">${all.map(skTile).join("")}</div></div>
        <div class="mid">
          <div class="lab" style="margin:0">Result</div>
          <div class="pv">
            <span class="tg" style="left:8px">SKATER${A ? " · " + esc(A.name) : ""}</span><span class="tg" style="right:8px">BOARD${B ? " · " + esc(B.name) : ""}</span>
            ${A && A.picture ? `<img src="${esc(thumb(A.picture))}" alt="">` : `<div class="empty">Pick a skater</div>`}
            ${B && hasBoard(B) ? `<img src="${esc(thumb(B.board[0]))}" alt="">` : `<div class="empty">Pick a board</div>`}
          </div>
          <input id="mixName" value="${esc(nameText)}" placeholder="${esc(A && B ? A.name + " + " + B.name : "Name (optional)")}">
          <div>${pieces.map(p => `<div class="row"><span class="k">${esc(p.category)}</span><span class="v${p.missing ? " gone" : ""}" title="${esc(p.missing ? MISSING_MSG : p.title)}">${esc(p.title)}<span class="from">from ${esc(p.src)}</span></span></div>`).join("") || `<div class="muted" style="font-size:12.5px">Pick both to see what the new fit holds.</div>`}</div>
          <div class="note">The skater picture still shows the first fit's board. Load the fit into the game and press ${snapKey()} for a real picture.</div>
        </div>
        <div class="col"><div class="lab">2 · Board from</div><div class="tiles">${all.map(bdTile).join("")}</div></div>
      </div>
      <div class="foot"><span class="hint">Face and body come from the skater fit.</span><span><button id="mixCancel">Cancel</button> <button class="primary" id="mixSave" ${sk && bd ? "" : "disabled"}>Save as new fit</button></span></div>`;
    scrim.querySelectorAll(".tiles").forEach((t, i) => { t.scrollTop = keepScroll[i] || 0; });
    const nm = scrim.querySelector("#mixName");
    nm.oninput = () => { nameText = nm.value; };
    scrim.querySelectorAll("[data-sk]").forEach(b => b.onclick = () => { sk = b.dataset.sk; draw(); });
    scrim.querySelectorAll("[data-bd]").forEach(b => b.onclick = () => { bd = b.dataset.bd; draw(); });
    scrim.querySelector("#mixCancel").onclick = () => scrim.remove();
    scrim.querySelector("#mixSave").onclick = () => {
      const name = nm.value.trim();
      scrim.remove();
      act(() => api("/api/fit/mix", {skater: sk, board: bd, name}));
    };
  };
  scrim.innerHTML = `<div class="dialog mix"></div>`;
  scrim.onclick = e => { if (e.target === scrim) scrim.remove(); };
  document.body.append(scrim);
  draw();
}

async function refresh(force) {
  try {
    const r = await fetch("/api/state");
    const text = await r.text();
    if (!force && text === lastJSON) return;
    if (!force && spinBusy) return; // try again next time, once the player lets go
    lastJSON = text;
    const next = JSON.parse(text);
    for (const k of ["lineup", "fits", "rotations", "pending", "events"]) next[k] = next[k] || [];
    next.views = next.views || {};
    next.fits.forEach(f => { f.pieces = f.pieces || []; f.rotations = f.rotations || []; });
    next.lineup.forEach(s => s.pieces = s.pieces || []);
    next.rotations.forEach(r => {
      r.slots = r.slots || Array(10).fill("");
      if (r.auto && /^Before /.test(r.name)) r.name = "Lineup before " + r.name.slice(7); // older Undo history entries
    });
    next.events.forEach(e => toast(e));
    S = next;
    const live = new Set(S.fits.map(f => f.hash));
    picked = picked.filter(h => live.has(h));
    render();
  } catch (e) {
    console.error(e);
    $("#statusText").textContent = e instanceof TypeError && /fetch/i.test(e.message) ? "Preset Wardrobe stopped" : "Display error: " + e.message;
  }
}

// Picture size: a slider at the bottom right scales the cards, so the grid fits more or fewer per row.
// 100% is the automatic size (the colored line on the slider); dropping the thumb on it goes back to automatic.
(() => {
  const root = document.documentElement, range = $("#sizeRange");
  const KEY = "pw-card-f";
  let saved = 0;
  try { saved = Number(localStorage.getItem(KEY)) || 0; } catch (e) {}
  range.value = saved >= 50 && saved <= 200 ? saved : 100;
  range.addEventListener("input", () => {
    const f = Number(range.value);
    if (Math.abs(f - 100) <= 5) { // on the line: automatic again
      root.classList.remove("sized"); range.value = 100;
      try { localStorage.removeItem(KEY); } catch (e) {}
      return;
    }
    root.style.setProperty("--f", f / 100); root.classList.add("sized");
    try { localStorage.setItem(KEY, String(f)); } catch (e) {}
  });
})();
// Card size: drag a card's bottom-right corner. Sideways makes it 2 or 3 columns wide, down shows more of the
// fit's pieces. The reset button puts every card back.
const MAXSPAN = 3, LINE = 21;
// Sizes belong to the screen they were set on (the same fit on another screen keeps its own), and they're kept in
// the app's own config so they survive closing it.
let cardSize = {}, sizesLoaded = false;
let sizing = false; // a card is being dragged: the reset button stays as it is until the drag ends
let autoLines = {}; // lines a card shows only because its row was made taller by another card (not saved)
const sizeKey = rid => view + "|" + rid;
const saveSizes = () => { api("/api/card-sizes", cardSize).catch(() => {}); };
const cardKey = c => { const r = c.querySelector(".rows"); return r ? sizeKey(r.dataset.rid) : ""; };
function setSpan(c, n) {
  c.style.gridColumn = n > 1 ? "span " + n : "";
  c.style.setProperty("--span", n);
  c.classList.toggle("wide", n > 1);
}
function showRows(c) {
  const holder = c.querySelector(".info .rows"), item = holder && S && itemById(holder.dataset.rid);
  if (!item) return 0;
  const pieces = piecesFor(item, showFor(item, holder.dataset.def));
  const show = showFor(item, holder.dataset.def);
  holder.innerHTML = rows(pieces, holder.dataset.rid, show);
  const m = /\+ (\d+) more/.exec(holder.innerHTML);
  const k = sizeKey(holder.dataset.rid);
  return (m ? +m[1] : 0) + Math.max((cardSize[k] && cardSize[k].h) || 0, autoLines[k] || 0); // pieces beyond the normal lines
}
function applyWidths() {
  for (const g of document.querySelectorAll("#main .grid")) {
    const cols = getComputedStyle(g).gridTemplateColumns.split(" ").filter(Boolean).length;
    for (const c of g.querySelectorAll(":scope > .card")) {
      const k = cardKey(c);
      if (!k) continue;
      if (!c.querySelector(":scope > .wgrip")) c.insertAdjacentHTML("beforeend", `<i class="wgrip" title="Drag to make this card bigger"></i>`);
      setSpan(c, Math.max(1, Math.min((cardSize[k] && cardSize[k].w) || 1, MAXSPAN, cols)));
    }
  }
  if (!sizing) $("#wReset").hidden = !Object.keys(cardSize).length;
  fillLines();
}
// A row is as tall as its tallest card, so the others in it have room to spare: they show more of their pieces.
function fillLines() {
  const cards = [...document.querySelectorAll("#main .grid > .card")].filter(c => c.querySelector(".info .rows"));
  const before = autoLines;
  autoLines = {};
  for (const c of cards) { const k = cardKey(c); if (before[k]) showRows(c); } // back to what each card shows by itself
  const room = c => { // free space under the card's lines
    const info = c.querySelector(".info"), r = info.querySelector(".rows");
    return info.getBoundingClientRect().bottom - parseFloat(getComputedStyle(info).paddingBottom) - r.getBoundingClientRect().bottom;
  };
  for (const c of cards) {
    const k = cardKey(c);
    if (cardSize[k] && cardSize[k].h) continue; // sized by hand
    const row = c.querySelector(".info .row");
    if (!row) continue;
    const step = row.getBoundingClientRect().height + 3;
    let n = Math.floor(room(c) / step);
    if (n < 1) continue;
    for (let i = 0; i < 4 && n > 0; i++) {
      autoLines[k] = n; showRows(c);
      if (room(c) >= -0.5) break;
      n--; autoLines[k] = n; showRows(c);
    }
    if (!n) delete autoLines[k];
  }
}
(() => {
  let drag = null, lastDrag = 0;
  document.addEventListener("pointerdown", e => {
    const grip = e.target.closest && e.target.closest(".wgrip");
    if (!grip || e.button !== 0) return;
    const card = grip.parentElement, grid = card.parentElement, key = cardKey(card);
    if (!key) return;
    e.preventDefault();
    const tracks = getComputedStyle(grid).gridTemplateColumns.split(" ").filter(Boolean);
    const colW = parseFloat(tracks[0]) || card.getBoundingClientRect().width;
    const cur = cardSize[key] || {};
    drag = {key, x0: e.clientX, y0: e.clientY, w0: cur.w || 1, h0: cur.h || 0, step: colW + 14, maxW: Math.min(MAXSPAN, tracks.length), maxH: showRows(card)};
    card.classList.add("wdragging"); document.body.classList.add("wdrag"); sizing = true;
  });
  window.addEventListener("pointermove", e => {
    if (!drag) return;
    const w = Math.max(1, Math.min(drag.maxW, drag.w0 + Math.round((e.clientX - drag.x0) / drag.step)));
    const h = Math.max(0, Math.min(drag.maxH, drag.h0 + Math.round((e.clientY - drag.y0) / LINE)));
    const cur = cardSize[drag.key] || {};
    if (w === (cur.w || 1) && h === (cur.h || 0)) return;
    if (w > 1 || h > 0) cardSize[drag.key] = {w, h}; else delete cardSize[drag.key];
    for (const c of document.querySelectorAll("#main .grid > .card")) if (cardKey(c) === drag.key) showRows(c);
    applyWidths();
  });
  const end = () => {
    if (!drag) return;
    drag = null; lastDrag = Date.now(); sizing = false;
    document.body.classList.remove("wdrag");
    $("#wReset").hidden = !Object.keys(cardSize).length;
    for (const c of document.querySelectorAll(".card.wdragging")) c.classList.remove("wdragging");
    saveSizes();
  };
  window.addEventListener("pointerup", end);
  window.addEventListener("pointercancel", end);
  // letting go over a card must not count as a click on it
  document.addEventListener("click", e => {
    if ((e.target.closest && e.target.closest(".wgrip")) || Date.now() - lastDrag < 300) { e.stopPropagation(); e.preventDefault(); }
  }, true);
  $("#wReset").addEventListener("click", () => {
    cardSize = {}; saveSizes();
    for (const c of document.querySelectorAll("#main .grid > .card")) showRows(c);
    applyWidths();
  });
})();
refresh(true);
setInterval(() => { if (!busy) refresh(false); pollLog(); }, 2500);
</script>
