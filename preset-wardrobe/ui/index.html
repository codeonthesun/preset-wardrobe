<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preset Wardrobe</title>
<style>
:root {
  --bg: #0f1114;
  --panel: #171a1f;
  --panel-2: #1e2229;
  --line: #2a2f38;
  --text: #eef0f3;
  --muted: #8f96a3;
  --faint: #5f6673;
  --accent: #5ecdfa;
  --accent-ink: #062330;
  --ok: #7bd88f;
  --warn: #f2b84b;
  --bad: #ff6b6b;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
  display: grid; grid-template-rows: auto 1fr; overflow: hidden;
}
button {
  font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap;
}
button:hover:not(:disabled) { border-color: #3b4250; background: #242932; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover:not(:disabled) { background: #7dd8fb; border-color: #7dd8fb; }
button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
button.ghost:hover:not(:disabled) { color: var(--text); background: var(--panel-2); }
button.small { padding: 4px 9px; font-size: 12.5px; border-radius: 6px; }
input[type=search], .dialog input {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 12px;
}
input:focus { outline: none; border-color: var(--accent); }

header {
  display: flex; align-items: center; gap: 16px; padding: 12px 20px;
  border-bottom: 1px solid var(--line); background: #121418;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font-size: 15px; letter-spacing: .18em; font-weight: 800; }
.brand span { color: var(--faint); font-size: 12px; letter-spacing: .08em; }
.status {
  margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted);
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.status.closed .dot { background: var(--ok); }
.status.running .dot { background: var(--warn); }

.layout { display: grid; grid-template-columns: 270px 1fr; min-height: 0; }
aside { border-right: 1px solid var(--line); padding: 16px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--faint); padding: 14px 10px 6px; }
.label:first-child { padding-top: 0; }
.nav {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; width: 100%;
  text-align: left; padding: 10px 12px; border-radius: 8px; background: transparent; border: 1px solid transparent;
}
.nav:hover:not(:disabled) { background: var(--panel); border-color: transparent; }
.nav.on { background: var(--panel-2); border-color: var(--line); }
.nav .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.nav .meta { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.badge {
  font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 2px 7px; border-radius: 999px;
  background: rgba(123,216,143,.14); color: var(--ok); text-transform: uppercase; white-space: nowrap;
}
.badge.blue { background: rgba(94,205,250,.16); color: var(--accent); }
.badge.grey { background: rgba(143,150,163,.14); color: var(--muted); }
.side-actions { display: flex; flex-direction: column; gap: 8px; padding: 12px 2px 0; }
.side-actions button { width: 100%; }
details.autos summary { list-style: none; cursor: pointer; }
details.autos summary::-webkit-details-marker { display: none; }
details.autos summary::after { content: " ▸"; }
details.autos[open] summary::after { content: " ▾"; }

main { overflow-y: auto; padding: 24px 28px 96px; min-width: 0; }
.head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.head h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
.head .sub { color: var(--muted); margin-top: 4px; }
.head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.notice {
  display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--radius);
  background: var(--panel); border: 1px solid var(--line); margin-bottom: 18px; color: var(--muted);
}
.notice strong { color: var(--text); }
.notice .grow { flex: 1; }
.notice.warn { border-color: rgba(242,184,75,.35); }
.notice.bad { border-color: rgba(255,107,107,.45); color: #ffb3b3; }
.kbd { font: 600 12px ui-monospace, Consolas, monospace; padding: 1px 6px; border: 1px solid #3b4250; border-bottom-width: 2px; border-radius: 5px; color: var(--text); }

.pending {
  display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: center; padding: 14px 16px;
  border-radius: var(--radius); background: var(--panel); border: 1px solid rgba(94,205,250,.45); margin-bottom: 18px;
}
.pending img { width: 120px; aspect-ratio: 3/4; object-fit: contain; border-radius: 8px; background: #1b1f26; }
.pending h3 { margin: 0 0 4px; font-size: 16px; }
.pending p { margin: 0 0 12px; color: var(--muted); }
.slotpick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1250px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .layout { grid-template-columns: 220px 1fr; } }
.card {
  position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; display: flex; flex-direction: column;
}
.card.sel { border-color: rgba(94,205,250,.6); }
.card.pickable { cursor: pointer; }
.card.pickable:hover { border-color: #3b4250; }
.card.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.pic {
  position: relative; aspect-ratio: 3 / 4;
  background: radial-gradient(120% 80% at 50% 100%, #262b34 0%, #181b21 60%, #15181d 100%);
  display: grid; place-items: center;
}
.pic img { width: 100%; height: 100%; object-fit: contain; }
.pic .empty { display: grid; justify-items: center; gap: 8px; color: var(--faint); font-size: 12px; text-align: center; padding: 0 10px; }
.pic .empty svg { width: 46%; opacity: .5; }
.tag {
  position: absolute; top: 8px; left: 8px; height: 24px; padding: 0 8px; display: grid; place-items: center;
  border-radius: 7px; font-weight: 700; font-size: 12px; background: rgba(15,17,20,.8); border: 1px solid var(--line);
}
.pic .badges { position: absolute; top: 9px; right: 8px; display: flex; gap: 4px; flex-direction: column; align-items: flex-end; }
.check {
  position: absolute; bottom: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 13px;
}
.info { padding: 10px 12px 12px; display: grid; gap: 3px; font-size: 12.5px; flex: 1; }
.info .title { font-weight: 650; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 3px; }
.row { display: grid; grid-template-columns: 54px 1fr; gap: 6px; }
.row .k { color: var(--faint); }
.row .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.more { color: var(--faint); font-size: 12px; }
.foot { display: flex; gap: 4px; padding: 0 10px 10px; flex-wrap: wrap; }
.slot-empty {
  border: 1.5px dashed #343a45; border-radius: var(--radius); display: grid; place-items: center; gap: 6px;
  color: var(--muted); background: transparent; min-height: 100%; aspect-ratio: auto; padding: 24px 10px; text-align: center;
}
.slot-empty:hover:not(:disabled) { border-color: var(--accent); color: var(--text); background: rgba(94,205,250,.04); }
.slot-empty b { font-size: 22px; font-weight: 400; color: var(--accent); }

.toolbar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
.toolbar input { flex: 1; max-width: 420px; }
.pickbar {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 5;
  display: flex; gap: 10px; align-items: center; padding: 10px 12px 10px 18px; border-radius: 12px;
  background: #20252d; border: 1px solid #3b4250; box-shadow: 0 16px 40px rgba(0,0,0,.45);
}

.scrim { position: fixed; inset: 0; background: rgba(5,6,8,.66); display: grid; place-items: center; z-index: 10; }
.dialog {
  width: min(480px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.dialog.wide { width: min(1100px, calc(100vw - 48px)); max-height: calc(100vh - 48px); grid-template-rows: auto auto 1fr auto; }
.dialog.wide .grid { overflow-y: auto; padding: 2px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: max-content; align-content: start; min-height: 0; }
.dialog.wide .info { padding: 8px 10px 10px; }
.dialog h2 { margin: 0; font-size: 18px; }
.dialog p { margin: 0; color: var(--muted); }
.dialog input { width: 100%; }
.dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; }
.dialog code { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); word-break: break-all; }
.toasts { position: fixed; bottom: 18px; right: 18px; display: grid; gap: 8px; z-index: 20; }
.toast {
  background: #20252d; border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; max-width: 380px;
  box-shadow: 0 12px 30px rgba(0,0,0,.4); animation: up .18s ease-out;
}
.toast.bad { border-color: rgba(255,107,107,.6); }
@keyframes up { from { transform: translateY(8px); opacity: 0; } }
.blank { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>PRESET WARDROBE</b><span>for ReSkate</span></div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Looking for skate.…</span></div>
  <button class="ghost" id="settingsBtn">Settings</button>
</header>
<div class="layout">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div class="toasts" id="toasts"></div>
<input type="file" id="importFile" accept=".wardrobe,.zip" hidden>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let S = null, lastJSON = "", view = "lineup", busy = false, search = "", picked = [];
const fitsBy = () => Object.fromEntries(S.fits.map(f => [f.hash, f]));

const silhouette = `<svg viewBox="0 0 64 120" fill="currentColor" aria-hidden="true"><circle cx="32" cy="14" r="11"/><path d="M14 32c0-4 4-7 8-7h20c4 0 8 3 8 7l4 34c.4 3-2 5-4.6 5H50l-2 44c0 2.5-2 4-4.4 4h-1.2c-2.4 0-4.2-1.7-4.4-4L36 74h-8l-2 41c-.2 2.3-2 4-4.4 4h-1.2C18 119 16 117.5 16 115l-2-44h-1.4C10 71 7.6 69 8 66z"/></svg>`;

function toast(msg, bad) {
  const t = document.createElement("div");
  t.className = "toast" + (bad ? " bad" : "");
  t.textContent = msg;
  $("#toasts").append(t);
  setTimeout(() => t.remove(), bad ? 6500 : 4000);
}

async function api(path, body, raw) {
  const opt = body === undefined ? {} : {method: "POST", headers: raw ? {} : {"Content-Type": "application/json"}, body: raw ? body : JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("Something went wrong (" + r.status + ")"));
  return j;
}

function dialog({title, text, input, okText = "OK", danger, cancel = true}) {
  return new Promise(resolve => {
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">
      <h2>${esc(title)}</h2>${text ? `<p>${text}</p>` : ""}
      ${input !== undefined ? `<input id="dlgInput" maxlength="60" value="${esc(input)}">` : ""}
      <div class="buttons">${cancel ? `<button id="dlgCancel">Cancel</button>` : ""}<button id="dlgOk" class="${danger ? "danger" : "primary"}">${esc(okText)}</button></div></div>`;
    document.body.append(scrim);
    const inp = $("#dlgInput", scrim);
    const done = v => { scrim.remove(); resolve(v); render(); };
    $("#dlgOk", scrim).onclick = () => done(inp ? inp.value : true);
    if (cancel) $("#dlgCancel", scrim).onclick = () => done(null);
    scrim.addEventListener("keydown", e => { if (e.key === "Escape" && cancel) done(null); if (e.key === "Enter") $("#dlgOk", scrim).click(); });
    scrim.onclick = e => { if (e.target === scrim && cancel) done(null); };
    (inp || $("#dlgOk", scrim)).focus();
    if (inp) inp.select();
  });
}

async function act(fn) {
  if (busy) return;
  busy = true;
  try { const r = await fn(); if (r && r.message) toast(r.message); }
  catch (e) { toast(e.message, true); }
  finally { busy = false; await refresh(true); }
}

function when(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const days = Math.floor((Date.now() - d) / 864e5);
  if (days < 1) return "today " + d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  if (days < 2) return "yesterday";
  return d.toLocaleDateString();
}

// The picture and the outfit's main pieces: shared by every card.
function pic(item, tag, badges = "") {
  return `<div class="pic">
    ${item.picture ? `<img src="${esc(item.picture)}" alt="" loading="lazy">` : `<div class="empty">${silhouette}<span>No picture yet</span></div>`}
    ${tag ? `<span class="tag">${esc(tag)}</span>` : ""}
    ${badges ? `<div class="badges">${badges}</div>` : ""}
  </div>`;
}
function rows(pieces) {
  const main = ["Headwear", "Top", "Bottoms", "Shoes", "Deck"];
  const label = {Headwear: "Head", Top: "Top", Bottoms: "Bottoms", Shoes: "Shoes", Deck: "Deck"};
  const shown = main.map(c => pieces.find(x => x.category === c)).filter(Boolean);
  const rest = pieces.filter(x => !shown.includes(x));
  return shown.map(x => `<div class="row"><span class="k">${label[x.category]}</span><span class="v" title="${esc(x.title)}">${esc(x.title)}</span></div>`).join("")
    + (rest.length ? `<div class="more" title="${esc(rest.map(x => x.category + ": " + x.title).join("\n"))}">+ ${rest.length} more</div>` : "");
}
function matches(f) {
  if (!search) return true;
  const q = search.toLowerCase();
  return f.name.toLowerCase().includes(q) || f.pieces.some(p => p.title.toLowerCase().includes(q));
}

// ---- sidebar ----
function renderSide() {
  const named = S.rotations.filter(r => !r.auto), autos = S.rotations.filter(r => r.auto);
  const inCat = S.lineup.filter(s => s.in_catalogue).length;
  const nav = (id, name, meta, badge = "") => `<button class="nav${view === id ? " on" : ""}" data-view="${esc(id)}">
    <span class="name">${esc(name)}</span>${badge || "<span></span>"}<span class="meta">${meta}</span></button>`;
  const visible = S.fits.filter(f => !f.hidden).length;
  $("#side").innerHTML = `
    <div class="label">IN THE GAME</div>
    ${nav("lineup", "In-Game Lineup", `${S.lineup.length} slots · ${inCat} in catalogue`)}
    <div class="label">YOUR FITS</div>
    ${nav("catalogue", "Fit Catalogue", `${visible} fit${visible === 1 ? "" : "s"}`, S.pending.length ? `<span class="badge blue">${S.pending.length} new</span>` : "")}
    <div class="label">ROTATIONS</div>
    ${named.length ? named.map(r => nav(r.id, r.name, `${r.filled} of 10 slots · ${esc(when(r.updated))}`, r.matches_game ? `<span class="badge">In game</span>` : "")).join("")
      : `<div class="more" style="padding:4px 12px 8px">No rotations yet. Pick 10 fits from your catalogue, or save your In-Game Lineup.</div>`}
    <div class="side-actions">
      <button class="primary" id="newRotation">New rotation</button>
      <button id="importBtn">Import a .wardrobe</button>
    </div>
    ${autos.length ? `<details class="autos"${autos.some(r => r.id === view) ? " open" : ""}><summary class="label">BEFORE-LOAD COPIES (${autos.length})</summary>
      ${autos.map(r => nav(r.id, r.name, esc(when(r.updated)), r.matches_game ? `<span class="badge">In game</span>` : "")).join("")}</details>` : ""}`;
}

// ---- snaps waiting for "which slot?" ----
function renderPending() {
  if (!S.pending.length) return "";
  const p = S.pending[0];
  const name = n => { const s = S.lineup.find(x => x.slot === n); return s ? s.name : ""; };
  const others = p.candidates.filter(n => n !== p.guess);
  return `<div class="pending">
    <img src="${esc(p.picture)}" alt="New snap">
    <div>
      <h3>New snap${S.pending.length > 1 ? ` (1 of ${S.pending.length})` : ""}: which slot was it?</h3>
      <p>Preset Wardrobe couldn't tell for sure. Pick the slot you had selected in the game.</p>
      <div class="slotpick">
        <button class="primary" data-resolve="${p.guess}">Slot ${p.guess}: ${esc(name(p.guess))}</button>
        ${others.map(n => `<button class="small" data-resolve="${n}" title="${esc(name(n))}">Slot ${n}</button>`).join("")}
        <button class="ghost small" data-resolve="0">Throw away</button>
      </div>
    </div></div>`;
}

// ---- views ----
function renderLineup(notices) {
  const missing = S.lineup.filter(s => !s.in_catalogue).length;
  if (!S.game_dir_ok) {
    notices.push(`<div class="notice warn"><div class="grow"><strong>Where is ReSkate installed?</strong> Set the game folder so snaps can come in from the plugin.</div><button id="setDir">Set game folder</button></div>`);
  } else if (!S.plugin_installed) {
    notices.push(`<div class="notice"><div class="grow"><strong>Want pictures?</strong> Install the Preset Wardrobe plugin: drag the zip onto the ReSkate Launcher's MODS page, then turn it on when the game asks.</div><button id="getPlugin">Get the plugin zip</button></div>`);
  } else {
    notices.push(`<div class="notice"><div class="grow"><strong>Add a fit with a picture:</strong> in skate., open the <strong>Skaters</strong> page, select a preset and press <span class="kbd">F8</span>. It lands in your Fit Catalogue by itself.</div></div>`);
  }
  return `<div class="head"><div><h1>In-Game Lineup</h1><div class="sub">The 10 presets in skate. right now.${missing ? ` ${missing} aren't in your catalogue yet.` : ""}</div></div>
    <div class="actions"><button id="lineupRotation">Save lineup as rotation</button>${missing ? `<button class="primary" id="addAll">Add all to catalogue</button>` : ""}</div></div>`
    + notices.join("") + `<div class="grid">${S.lineup.map(s => `<div class="card${s.selected ? " sel" : ""}">
      ${pic(s, "Slot " + s.slot, (s.selected ? `<span class="badge blue">Selected</span>` : "") + (s.in_catalogue ? "" : `<span class="badge grey">Not in catalogue</span>`))}
      <div class="info"><div class="title" title="${esc(s.name)}">${esc(s.name)}</div>${rows(s.pieces)}</div>
      ${s.in_catalogue ? "" : `<div class="foot"><button class="small" data-add="${s.slot}">Add to catalogue</button></div>`}
    </div>`).join("")}</div>`;
}

function renderCatalogue(notices) {
  const fits = S.fits.filter(f => !f.hidden);
  const shown = fits.filter(matches);
  let body;
  if (!fits.length) {
    body = `<div class="blank">Your Fit Catalogue is empty.<br>Press <span class="kbd">F8</span> on the game's Skaters page, or add fits from your In-Game Lineup.</div>`;
  } else if (!shown.length) {
    body = `<div class="blank">No fits match “${esc(search)}”.</div>`;
  } else {
    body = `<div class="grid">${shown.map(f => {
      const n = picked.indexOf(f.hash);
      const badges = (f.in_game ? `<span class="badge">In game</span>` : "") + (f.rotations.length ? `<span class="badge grey" title="${esc(f.rotations.join("\n"))}">${f.rotations.length} rotation${f.rotations.length > 1 ? "s" : ""}</span>` : "");
      return `<div class="card pickable${n >= 0 ? " picked" : ""}" data-pick="${f.hash}">
        ${pic(f, "", badges)}${n >= 0 ? `<span class="check">${n + 1}</span>` : ""}
        <div class="info"><div class="title" title="${esc(f.name)}">${esc(f.name)}</div>${rows(f.pieces)}</div>
        <div class="foot"><button class="small ghost" data-rename="${f.hash}">Rename</button><button class="small ghost" data-delete="${f.hash}">Delete</button></div>
      </div>`; }).join("")}</div>`;
  }
  return `<div class="head"><div><h1>Fit Catalogue</h1><div class="sub">${fits.length} saved fit${fits.length === 1 ? "" : "s"}. Click fits to pick up to 10 for a rotation.</div></div>
    <div class="actions"><button id="exportCat" ${fits.length ? "" : "disabled"}>Export catalogue</button></div></div>`
    + notices.join("")
    + (fits.length ? `<div class="toolbar"><input type="search" id="search" placeholder="Search fits by name or piece (e.g. Vans, hoodie)" value="${esc(search)}"></div>` : "")
    + body
    + (picked.length ? `<div class="pickbar"><span><b>${picked.length}</b> of 10 picked</span><button class="primary" id="makeRotation">Make rotation</button><button class="ghost" id="clearPicks">Clear</button></div>` : "");
}

function renderRotation(r, notices) {
  const by = fitsBy();
  if (S.game_running) notices.push(`<div class="notice warn"><div class="grow"><strong>Close skate. to load this rotation.</strong> The game rewrites your presets when it quits, so loading only works while it's closed.</div></div>`);
  if (r.auto) notices.push(`<div class="notice"><div class="grow">This is an automatic copy of your In-Game Lineup from before a load, in case you want it back. Rename it to keep it for good.</div></div>`);
  const canLoad = !S.game_running && r.filled > 0 && !r.matches_game;
  const why = S.game_running ? "Close skate. first" : r.filled === 0 ? "Pick some fits first" : r.matches_game ? "Already in the game" : "Put these fits into the game's slots";
  return `<div class="head"><div><h1>${esc(r.name)}</h1><div class="sub">${r.filled} of 10 slots filled${r.filled < 10 ? " · empty slots keep what's in the game" : ""}${r.matches_game ? " · this is what's in the game now" : ""}</div></div>
    <div class="actions">
      <button class="primary" id="load" ${canLoad ? "" : "disabled"} title="${why}">Load into game</button>
      <button id="rename">Rename</button>
      <button id="export" ${r.filled ? "" : "disabled"}>Export</button>
      <button class="danger" id="delete">Delete</button>
    </div></div>` + notices.join("") + `<div class="grid">${r.slots.map((h, i) => {
      const f = h && by[h];
      if (!f) return `<button class="slot-empty" data-slotpick="${i}"><b>+</b>Slot ${i + 1}<br><span class="more">Pick a fit</span></button>`;
      return `<div class="card">
        ${pic(f, "Slot " + (i + 1))}
        <div class="info"><div class="title" title="${esc(f.name)}">${esc(f.name)}</div>${rows(f.pieces)}</div>
        <div class="foot">
          <button class="small" data-slotpick="${i}">Change</button>
          <button class="small ghost" data-move="${i},-1" ${i === 0 ? "disabled" : ""} title="Move left">◀</button>
          <button class="small ghost" data-move="${i},1" ${i === 9 ? "disabled" : ""} title="Move right">▶</button>
          <button class="small ghost" data-clear="${i}">Clear</button>
        </div></div>`; }).join("")}</div>`;
}

function render() {
  if (!S || document.querySelector(".scrim")) return;
  const st = $("#status");
  st.className = "status " + (S.game_running ? "running" : "closed");
  $("#statusText").textContent = S.game_running ? "skate. is running" : "skate. is closed";
  if (!["lineup", "catalogue"].includes(view) && !S.rotations.some(r => r.id === view)) view = "lineup";
  renderSide();
  const notices = [];
  if (S.profile_error) notices.push(`<div class="notice bad"><div class="grow">${esc(S.profile_error)}</div></div>`);
  const pending = renderPending();
  let html;
  if (view === "lineup") html = renderLineup(notices);
  else if (view === "catalogue") html = renderCatalogue(notices);
  else html = renderRotation(S.rotations.find(r => r.id === view), notices);
  const focused = document.activeElement && document.activeElement.id === "search";
  $("#main").innerHTML = pending + html;
  if (focused) { const s = $("#search"); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  wire();
}

// ---- the fit picker for a rotation slot ----
function pickFit(slot) {
  return new Promise(resolve => {
    const fits = S.fits.filter(f => !f.hidden);
    const scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML = `<div class="dialog wide"><h2>Pick a fit for slot ${slot + 1}</h2>
      <input type="search" id="pickSearch" placeholder="Search fits">
      <div class="grid" id="pickGrid"></div>
      <div class="buttons"><button id="pickCancel">Cancel</button></div></div>`;
    document.body.append(scrim);
    const grid = $("#pickGrid", scrim);
    const draw = q => {
      const list = fits.filter(f => !q || f.name.toLowerCase().includes(q) || f.pieces.some(p => p.title.toLowerCase().includes(q)));
      grid.innerHTML = list.length ? list.map(f => `<div class="card pickable" data-choose="${f.hash}" title="${esc(f.pieces.map(x => x.category + ": " + x.title).join("\n"))}">${pic(f, "", f.in_game ? `<span class="badge">In game</span>` : "")}<div class="info"><div class="title">${esc(f.name)}</div></div></div>`).join("")
        : `<div class="blank">${fits.length ? "No fits match." : "Your Fit Catalogue is empty."}</div>`;
      grid.querySelectorAll("[data-choose]").forEach(el => el.onclick = () => done(el.dataset.choose));
    };
    const done = v => { scrim.remove(); resolve(v); render(); };
    $("#pickSearch", scrim).oninput = e => draw(e.target.value.toLowerCase());
    $("#pickCancel", scrim).onclick = () => done(null);
    scrim.onclick = e => { if (e.target === scrim) done(null); };
    scrim.addEventListener("keydown", e => { if (e.key === "Escape") done(null); });
    draw("");
    $("#pickSearch", scrim).focus();
  });
}

function wire() {
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  const all = (attr, fn) => document.querySelectorAll(`[${attr}]`).forEach(el => el.onclick = e => { e.stopPropagation(); fn(el.getAttribute(attr), el); });
  all("data-view", v => { view = v; render(); });
  all("data-resolve", n => act(() => api("/api/pending/resolve", {id: S.pending[0].id, slot: +n})));
  on("newRotation", async () => {
    const name = await dialog({title: "New rotation", text: "Name it, then pick a fit for each slot.", input: S.default_rotation_name, okText: "Create"});
    if (name === null) return;
    act(async () => { const r = await api("/api/rotation/create", {name}); view = r.id; return r; });
  });
  on("importBtn", () => $("#importFile").click());
  on("getPlugin", () => act(() => api("/api/open", {what: "plugin"})));
  on("setDir", openSettings);

  // lineup
  all("data-add", n => act(() => api("/api/fit/add", {slot: +n})));
  on("addAll", () => act(async () => {
    let n = 0;
    for (const s of S.lineup) if (!s.in_catalogue) { await api("/api/fit/add", {slot: s.slot}); n++; }
    return {message: `Added ${n} fits to your Fit Catalogue.`};
  }));
  on("lineupRotation", async () => {
    const name = await dialog({title: "Save lineup as rotation", text: "Your 10 in-game presets become a rotation, and each one is added to your Fit Catalogue.", input: S.default_rotation_name, okText: "Save"});
    if (name === null) return;
    act(async () => { const r = await api("/api/rotation/create", {name, from_lineup: true}); view = r.id; return r; });
  });

  // catalogue
  const s = $("#search");
  if (s) s.oninput = e => { search = e.target.value; render(); };
  document.querySelectorAll("[data-pick]").forEach(el => el.onclick = () => {
    const h = el.dataset.pick, i = picked.indexOf(h);
    if (i >= 0) picked.splice(i, 1);
    else if (picked.length < 10) picked.push(h);
    else toast("A rotation holds 10 fits. Unpick one first.", true);
    render();
  });
  all("data-rename", async h => {
    const f = fitsBy()[h];
    const name = await dialog({title: "Rename fit", input: f.name, okText: "Rename"});
    if (name !== null) act(() => api("/api/fit/rename", {hash: h, name}));
  });
  all("data-delete", async h => {
    const f = fitsBy()[h];
    const used = f.rotations.length ? ` It's in ${f.rotations.length} rotation${f.rotations.length > 1 ? "s" : ""}; those slots become empty.` : "";
    const ok = await dialog({title: `Delete ${f.name}?`, text: "It's removed from your Fit Catalogue. Your game isn't changed." + used, okText: "Delete", danger: true});
    if (ok) act(async () => { picked = picked.filter(x => x !== h); return api("/api/fit/delete", {hash: h}); });
  });
  on("clearPicks", () => { picked = []; render(); });
  on("makeRotation", async () => {
    const name = await dialog({title: "Make a rotation", text: `Your ${picked.length} picks fill slots 1 to ${picked.length}, in the order you picked them.${picked.length < 10 ? " The other slots keep what's in the game." : ""}`, input: S.default_rotation_name, okText: "Make rotation"});
    if (name === null) return;
    act(async () => { const r = await api("/api/rotation/create", {name, slots: picked}); picked = []; view = r.id; return r; });
  });
  on("exportCat", () => { location.href = "/api/export"; toast("Exporting your Fit Catalogue as a .wardrobe file."); });

  // rotation
  const r = S.rotations.find(x => x.id === view);
  if (!r) return;
  const save = slots => act(() => api("/api/rotation/update", {id: r.id, slots}));
  all("data-slotpick", async i => {
    const h = await pickFit(+i);
    if (!h) return;
    const slots = [...r.slots]; slots[+i] = h; save(slots);
  });
  all("data-clear", i => { const slots = [...r.slots]; slots[+i] = ""; save(slots); });
  all("data-move", v => {
    const [i, d] = v.split(",").map(Number), j = i + d, slots = [...r.slots];
    [slots[i], slots[j]] = [slots[j], slots[i]]; save(slots);
  });
  on("load", async () => {
    const ok = await dialog({title: `Load ${r.name}?`, text: `${r.filled} of your game's slots get this rotation's fits.${r.filled < 10 ? " The empty slots keep what's in the game." : ""} Your In-Game Lineup is kept as a before-load copy, and the whole profile is backed up first.`, okText: "Load into game"});
    if (ok) act(() => api("/api/rotation/load", {id: r.id}));
  });
  on("rename", async () => {
    const name = await dialog({title: "Rename rotation", input: r.name, okText: "Rename"});
    if (name) act(() => api("/api/rotation/update", {id: r.id, name}));
  });
  on("export", () => { location.href = "/api/export?rotation=" + encodeURIComponent(r.id); toast("Exporting " + r.name + " as a .wardrobe file."); });
  on("delete", async () => {
    const ok = await dialog({title: `Delete ${r.name}?`, text: "The rotation is removed. Its fits stay in your Fit Catalogue, and your game isn't changed.", okText: "Delete", danger: true});
    if (ok) act(async () => { const res = await api("/api/rotation/delete", {id: r.id}); view = "lineup"; return res; });
  });
}

async function openSettings() {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="dialog">
    <h2>Settings</h2>
    <p>Game folder (the one with Skate.exe and the Mods folder):</p>
    <input id="dirInput" value="${esc(S.game_dir)}" placeholder="C:\\Users\\you\\Documents\\ReSkate">
    <p>Skater profile: <code>${esc(S.profile_db)}</code></p>
    <div class="buttons" style="justify-content:space-between">
      <span><button id="openBackups">Open backups</button> <button id="getPlugin2">Get the plugin zip</button></span>
      <span><button id="closeSet">Close</button> <button class="primary" id="saveDir">Save</button></span>
    </div>
    <p style="font-size:12px">Preset Wardrobe ${esc(S.version)}</p></div>`;
  document.body.append(scrim);
  const close = () => { scrim.remove(); render(); };
  $("#closeSet", scrim).onclick = close;
  scrim.onclick = e => { if (e.target === scrim) close(); };
  $("#openBackups", scrim).onclick = () => act(() => api("/api/open", {what: "backups"}));
  $("#getPlugin2", scrim).onclick = () => act(() => api("/api/open", {what: "plugin"}));
  $("#saveDir", scrim).onclick = () => act(async () => { const r = await api("/api/settings", {game_dir: $("#dirInput", scrim).value}); close(); return r; });
}
$("#settingsBtn").onclick = () => S && openSettings();

$("#importFile").onchange = async e => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  act(async () => { const r = await api("/api/import", await f.arrayBuffer(), true); view = r.id || "catalogue"; return r; });
};

async function refresh(force) {
  try {
    const r = await fetch("/api/state");
    const text = await r.text();
    if (!force && text === lastJSON) return;
    lastJSON = text;
    const next = JSON.parse(text);
    for (const k of ["lineup", "fits", "rotations", "pending", "events"]) next[k] = next[k] || [];
    next.fits.forEach(f => { f.pieces = f.pieces || []; f.rotations = f.rotations || []; });
    next.lineup.forEach(s => s.pieces = s.pieces || []);
    next.rotations.forEach(r => r.slots = r.slots || Array(10).fill(""));
    next.events.forEach(e => toast(e));
    S = next;
    const live = new Set(S.fits.map(f => f.hash));
    picked = picked.filter(h => live.has(h));
    render();
  } catch (e) {
    console.error(e);
    $("#statusText").textContent = e instanceof TypeError && /fetch/i.test(e.message) ? "Preset Wardrobe stopped" : "Display error: " + e.message;
  }
}
refresh(true);
setInterval(() => { if (!busy) refresh(false); }, 2500);
</script>
</body>
</html>
