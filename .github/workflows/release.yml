name: Release

# Two ways to make a release, both ending in a draft to check and publish:
#  - Actions > Release > Run workflow, and type the version (e.g. 0.2.0). The tag is made for you.
#  - Or push a tag like v0.2.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.2.0"
        required: true
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write      # create the release
  id-token: write      # sign the build provenance
  attestations: write  # publish it

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - name: Check the version
        run: |
          TAG="${RAW_TAG#vv}"; TAG="v${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 0.2.0 (got ${TAG})"; exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        run: bash scripts/build-release.sh "${TAG}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/PresetWardrobe.exe
            dist/PresetWardrobe-plugin.zip
            dist/PresetWardrobe-*.zip

      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > dist/NOTES.md
          if [ ! -s dist/NOTES.md ]; then echo "Preset Wardrobe ${VERSION}" > dist/NOTES.md; fi
          {
            echo
            echo "### Verify your download"
            echo "Compare the file's SHA-256 with \`SHA256SUMS.txt\`, or check it was built here with the GitHub CLI:"
            echo '```'
            echo "gh attestation verify PresetWardrobe.exe --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> dist/NOTES.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" --draft --target "${GITHUB_SHA}" \
            --title "Preset Wardrobe ${TAG}" --notes-file dist/NOTES.md \
            dist/PresetWardrobe-*.zip dist/PresetWardrobe.exe dist/PresetWardrobe-plugin.zip dist/SHA256SUMS.txt
