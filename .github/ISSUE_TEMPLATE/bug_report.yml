name: Bug report
description: Something in Preset Wardrobe or the Preset Wardrobe plugin doesn't work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Preset Wardrobe version
      description: Shown at the bottom of Settings.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: reskate
    attributes:
      label: ReSkate version
      placeholder: "2.1.3"
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options:
        - The program (PresetWardrobe.exe)
        - The in-game plugin (F8 snapping, banner, framing)
        - Loading a rotation into the game
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to make it happen again help a lot. Screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste any lines that mention PresetWardrobe from `<game folder>\logs\ReSkate.log`,
        and the contents of `%LOCALAPPDATA%\PresetWardrobe\PresetWardrobe.log`.
        Check them for anything personal first.
      render: text
